name: CI

on:
  push:
    branches: [modernize]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.xcode && format(', Xcode {0}', matrix.xcode) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported toolchain (README: Xcode 16+), so newer Swift can't slip in.
          - os: macos-15
            xcode: "16.0"
          # Each image's default Xcode, up to the current one.
          - os: macos-15
          - os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode
        run: |
          DIR="/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
          [ -d "$DIR" ] || { echo "::error::Xcode ${{ matrix.xcode }} is not on the ${{ matrix.os }} image"; exit 1; }
          echo "DEVELOPER_DIR=$DIR" >> "$GITHUB_ENV"
      - name: Toolchain
        run: xcodebuild -version && xcrun swift --version
      - name: Unit tests
        run: make test

  package:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build number = commit count
      - name: Check shell scripts
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Build universal beta package
        run: make beta
      - name: Check the package (bundle, zip, data check, install)
        run: scripts/check-package.sh "$HOME/Library/Caches/GoldenPassport-build/dist/GoldenPassport-$(cat VERSION)-beta.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: GoldenPassport-beta
          path: ~/Library/Caches/GoldenPassport-build/dist/*.zip
          retention-days: 14
